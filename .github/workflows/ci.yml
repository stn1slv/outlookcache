name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint and vet (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: go vet
        run: go vet ./...

      # The binary is built for macOS only, so vet that build too. The code
      # is pure Go and cross-checks from Linux.
      - name: go vet (darwin)
        run: go vet ./...
        env:
          GOOS: darwin

      # golangci-lint is pinned as a tool in go.mod, so it is built with the
      # same Go version as the project.
      - name: golangci-lint
        run: go tool golangci-lint run --timeout=5m ./...

      # The output is kept in a variable, so a failing gofumpt fails the step.
      - name: gofumpt
        run: |
          out=$(go tool gofumpt -extra -l .)
          if [ -n "$out" ]; then
            echo "Run 'make format' for:"
            echo "$out"
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      # The tool must never talk to the network. See the script for what
      # the check covers.
      - name: No network code
        run: make nonet

      # The release archive ships THIRD_PARTY_NOTICES.md, so it must list
      # the licenses of the modules that are linked into the binary now.
      - name: Third-party notices are current
        run: make notices && git diff --exit-code THIRD_PARTY_NOTICES.md

      - name: GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

      - name: govulncheck
        run: go tool govulncheck ./...

  test-ubuntu:
    name: Tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      # The fixture writer and the discovery tool are for development only.
      - name: Check coverage
        run: |
          grep -v -e '/internal/hxtest/' -e '/cmd/hxdiscover/' coverage.out > coverage-prod.out
          total=$(go tool cover -func=coverage-prod.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "Total coverage (excluding hxtest and hxdiscover): ${total}%"
          awk -v cov="$total" 'BEGIN { exit (cov + 0 < 80 ? 1 : 0) }'

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-ubuntu
          path: coverage.out

  test-darwin:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: go build
        run: make build

      - name: go test
        run: make test
